<!--
  Иконка rec.verter. Исходник: всё остальное (adaptive-icon для Android,
  PNG для стора и веба) получается отсюда, см. tools/icon/render_icon.py.

  Смысл: слева кадр видео — треугольник «play», справа звук, который из него
  выходит. Две фигуры, никакого текста и мелких деталей: иконка должна читаться
  в 48 px в списке приложений.

  Система координат — 108×108, как у адаптивной иконки Android. Видимой в
  лаунчере остаётся центральная область диаметром 72, поэтому вся графика
  умещается в круг радиуса 36 вокруг точки (54, 54): иначе круглая маска
  срежет углы треугольника.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <rect width="108" height="108" fill="#12263A"/>
  <path d="M30,35 L30,73 L54,54 Z"
        fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  <g fill="none" stroke="#35C4F0" stroke-width="5" stroke-linecap="round">
    <path d="M61.79,47.11 A9,9 0 0 1 61.79,60.89"/>
    <path d="M67.25,40.59 A17.5,17.5 0 0 1 67.25,67.41"/>
    <path d="M72.71,34.08 A26,26 0 0 1 72.71,73.92"/>
  </g>
</svg>
